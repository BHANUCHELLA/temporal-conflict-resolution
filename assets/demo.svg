xt x="0" textLength="328" font-weight="bold" class="foreground">  SCENARIO 4 &#8212; Missing Source &amp; Timestamp</text></g><g id="g22"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="96" font-weight="bold" class="foreground">TXN-DEMO-004</text><text x="112" textLength="24" class="foreground">  [</text><text x="136" textLength="48" class="color3">WARNED</text><text x="184" textLength="8" class="foreground">]</text></g><g id="g23"><text x="0" textLength="464" class="foreground">    v1  src=UnknownSource  amt=800.0  cur=USD  status=None</text></g><g id="g24"><text x="0" textLength="32" class="foreground">    </text><text x="32" textLength="8" class="color3">!</text><text x="40" textLength="368" class="foreground"> Missing source; defaulted to 'UnknownSource'.</text></g><g id="g25"><text x="0" textLength="32" class="foreground">    </text><text x="32" textLength="8" class="color3">!</text><text x="40" textLength="544" class="foreground"> Missing timestamp; used current system time (2026-08-15T14:29:58Z).</text></g><g id="g26"><text x="0" textLength="8" class="background"> </text></g><g id="g27"><text x="0" textLength="624" font-weight="bold" class="foreground">  SCENARIO 5 &#8212; Invalid Status Transition (Pending &#8594; Completed, skips Approved)</text></g><g id="g28"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="96" font-weight="bold" class="foreground">TXN-DEMO-005</text><text x="112" textLength="24" class="foreground">  [</text><text x="136" textLength="48" class="color3">WARNED</text><text x="184" textLength="8" class="foreground">]</text></g><g id="g29"><text x="0" textLength="488" class="foreground">    v1  src=PrimaryBank  amt=3000.0  cur=None  status=Pending</text></g><g id="g30"><text x="0" textLength="32" class="foreground">    </text><text x="32" textLength="8" class="color3">!</text><text x="40" textLength="664" class="foreground"> Invalid status transition rejected: 'Pending' -&gt; 'Completed'. Retaining 'Pending'.</text></g><g id="g31"><text x="0" textLength="544" class="foreground">    conflict [status] PrimaryBank(Pending) vs PrimaryBank(Completed)</text></g><g id="g32"><text x="0" textLength="800" class="foreground">    (same source wins the field conflict, but the status jump itself is invalid, so it's rejected an</text></g><g id="g33"><text x="0" textLength="192" class="foreground">d 'Pending' is retained)</text></g><g id="g34"><text x="0" textLength="328" font-weight="bold" class="foreground">  SCENARIO 6 &#8212; Midnight Boundary Crossing</text></g><g id="g35"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="96" font-weight="bold" class="foreground">TXN-DEMO-006</text><text x="112" textLength="24" class="foreground">  [</text><text x="136" textLength="176" class="color6">RESOLVED (2 conflicts)</text><text x="312" textLength="8" class="foreground">]</text></g><g id="g36"><text x="0" textLength="480" class="foreground">    v2  src=PrimaryBank  amt=1000.0  cur=USD  status=Pending</text></g><g id="g37"><text x="0" textLength="528" class="foreground">    conflict [amount] PrimaryBank(1000.0) vs SecondaryBank(1050.0)</text></g><g id="g38"><text x="0" textLength="320" class="foreground">    conflict [status] PrimaryBank(Pendin</text><text x="320" textLength="8" class="background"> </text></g><g id="g39"><text x="0" textLength="552" class="foreground">    conflict [status] PrimaryBank(Pending) vs SecondaryBank(Approved)</text></g><g id="g40"><text x="0" textLength="32" class="foreground">    </text><text x="32" textLength="16" class="color2">-&gt;</text><text x="48" textLength="616" class="foreground"> [amount] = 1000.0  (source priority: 'PrimaryBank' outranks 'SecondaryBank')</text></g><g id="g41"><text x="0" textLength="32" class="foreground">    </text><text x="32" textLength="16" class="color2">-&gt;</text><text x="48" textLength="624" class="foreground"> [status] = Pending  (source priority: 'PrimaryBank' ou