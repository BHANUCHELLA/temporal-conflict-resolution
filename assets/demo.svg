<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="terminal" baseProfile="full" viewBox="0 0 800 512" width="800" version="1.1">
    <defs>
        <termtosvg:template_settings xmlns:termtosvg="https://github.com/nbedos/termtosvg">
            <termtosvg:screen_geometry columns="100" rows="30"/>
            <termtosvg:animation type="css"/>
        </termtosvg:template_settings>
        <style type="text/css" id="generated-style"><![CDATA[#screen {
                font-family: 'DejaVu Sans Mono', monospace;
                font-style: normal;
                font-size: 14px;
            }

        text {
            dominant-baseline: text-before-edge;
            white-space: pre;
        }
    
            :root {
                --animation-duration: 1025ms;
            }

            @keyframes roll {
                0.000%{transform:translateY(0px)}
0.293%{transform:translateY(-544px)}
0.390%{transform:translateY(-1088px)}
1.366%{transform:translateY(-1632px)}
1.951%{transform:translateY(-2176px)}
2.439%{transform:translateY(-2720px)}
100.000%{transform:translateY(-2720px)}
            }

            #screen_view {
                animation-duration: 1025ms;
                animation-iteration-count:infinite;
                animation-name:roll;
                animation-timing-function: steps(1,end);
                animation-fill-mode: forwards;
            }
        ]]></style>
        <style type="text/css" id="user-style">
